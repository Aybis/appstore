<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAYA — internal app distribution</title>
    <meta
      name="description"
      content="MAYA distributes your company's own Android and iOS builds to your own people. Private catalog, release tracks, beta testers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <script>
      /*
       * Runs before the first paint, deliberately inline and un-deferred.
       *
       * A stored preference applied from React would arrive after the browser
       * had already painted the OS theme — so anyone who chose light on a dark
       * machine would get a dark flash on every single page load. This is the
       * one thing worth blocking the parser for.
       */
      try {
        var t = localStorage.getItem('maya.console.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {
        /* Private mode can throw on localStorage. Following the OS is a fine
           outcome; a blank page is not. */
      }
    </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
